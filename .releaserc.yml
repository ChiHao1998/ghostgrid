branches:
  - main

plugins:
  - "@semantic-release/commit-analyzer"
  - "@semantic-release/release-notes-generator"
  - - "@semantic-release/exec"
    - prepareCmd: >
        tar -czf /tmp/ghostgrid-${nextRelease.version}.tar.gz
        --exclude=.git
        --exclude="*.tar.gz"
        . &&
        mv /tmp/ghostgrid-${nextRelease.version}.tar.gz .
  - - "@semantic-release/github"
    - assets:
        - path: "ghostgrid-*.tar.gz"
          label: "ghostgrid-${nextRelease.version}.tar.gz"
